name: release

# Push a tag like v0.1.0 to publish prebuilt binaries that install.sh downloads.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          # Best effort: prebuilt ONNX Runtime binaries for Intel macOS may not be available.
          - { target: x86_64-apple-darwin, os: macos-15-intel, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --target ${{ matrix.target }} -p mem-cli
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="agent-mem-${{ matrix.target }}"
          mkdir -p dist/stage
          cp "target/${{ matrix.target }}/release/agent-mem" README.md LICENSE dist/stage/
          tar -C dist/stage -czf "dist/$name.tar.gz" .
          (cd dist && (shasum -a 256 "$name.tar.gz" 2>/dev/null || sha256sum "$name.tar.gz") | awk '{print $1}' > "$name.tar.gz.sha256")
      - name: Smoke test the packaged binary
        shell: bash
        run: |
          tar -xzf "dist/agent-mem-${{ matrix.target }}.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/agent-mem" --version
          "$RUNNER_TEMP/agent-mem" template | head -3
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" "dist/agent-mem-${{ matrix.target }}.tar.gz" "dist/agent-mem-${{ matrix.target }}.tar.gz.sha256" --clobber
